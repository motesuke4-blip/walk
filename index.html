<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>都営ウォーキング コースタイム</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#14202B; --sub:#5B6875; --line:#D9DFE5;
  --tint:#EAF0F5; --ok:#15803D; --late:#B45309; --acc:#0079C2;
  --shadow:0 1px 2px rgba(20,32,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#171E26; --ink:#E8EDF2; --sub:#9AA7B4; --line:#2A343F;
    --tint:#1E2731; --ok:#4ADE80; --late:#FBBF24; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E26; --ink:#E8EDF2; --sub:#9AA7B4; --line:#2A343F;
  --tint:#1E2731; --ok:#4ADE80; --late:#FBBF24; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

/* sticky header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);
     border-bottom:1px solid var(--line)}
.cattabs{display:flex;gap:6px;overflow-x:auto;padding:9px 12px 6px;scrollbar-width:none;max-width:560px;margin:0 auto}
.cattabs::-webkit-scrollbar{display:none}
.cattab{flex:0 0 auto;min-height:30px;padding:0 12px;border-radius:14px;border:0;
     background:var(--tint);font-weight:700;font-size:12.5px;color:var(--sub)}
.cattab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none;max-width:560px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 10px;border-radius:20px;border:1.5px solid var(--line);
     background:var(--surface);font-weight:600;font-size:14px;color:var(--sub);display:flex;align-items:center;gap:5px}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.tab[aria-selected="true"]{border-color:var(--c);color:var(--ink);background:var(--surface);box-shadow:inset 0 -3px 0 var(--c)}
.prog{max-width:560px;margin:0 auto;padding:0 12px 10px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--sub)}
.prog-row b{color:var(--ink);font-size:14px}
.goalrow{margin-top:6px;padding:7px 10px;border-radius:8px;background:var(--tint);font-size:13.5px;color:var(--sub)}
.goalrow b{font-size:18px;color:var(--ink);margin:0 2px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* summary */
h1{font-size:20px;line-height:1.3;margin:16px 0 2px}
.route{color:var(--sub);margin:0 0 6px}
.sync{font-size:12px;color:var(--sub);margin:0 0 12px}
.revbtn{min-height:40px;margin:2px 0 8px;padding:0 14px;border-radius:20px;border:1.5px solid var(--acc);background:var(--surface);color:var(--acc);font-weight:700;font-size:14px}
.revbtn.arm{border-color:var(--late);color:var(--late)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.sum b{display:block;font-size:19px;line-height:1.2}
.sum span{font-size:11.5px;color:var(--sub)}
.dst{display:flex;justify-content:center;gap:6px;margin:4px 0 2px}
.dst button{width:40px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;line-height:1;padding:0}
.dst button:disabled{opacity:.35;cursor:default}
.pace{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--tint);border-left:5px solid var(--acc);font-size:14px}
.pace span{font-size:12px;color:var(--sub)}
.at small{display:block;text-align:right;font-size:11px;font-weight:400;color:var(--sub)}
.days{margin:0 0 10px;padding:0;list-style:none;font-size:13px;color:var(--sub)}
.days li{padding:4px 0;border-top:1px solid var(--line)}
.days li:first-child{border-top:0}
.days b{color:var(--ink)}

details.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
details.set>summary{list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600;cursor:pointer}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"開く";font-weight:400;font-size:13px;color:var(--sub)}
details.set[open]>summary::after{content:"閉じる"}
.setgrid{padding:4px 14px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.setgrid label{display:block;font-size:12px;color:var(--sub)}
.setgrid input{width:100%;min-height:44px;margin-top:3px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:16px}
.setnote{grid-column:1/-1;font-size:12px;color:var(--sub);margin:0}
.ghost{grid-column:1/-1;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--sub)}
.ghost.arm{border-color:var(--late);color:var(--late)}

/* timeline */
.day{margin:16px 0 6px;padding:10px 12px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.day small{font-weight:400;opacity:.92;font-size:12.5px}
.st{position:relative;display:grid;grid-template-columns:48px 1fr;}
.st::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:4px;background:var(--acc);border-radius:2px}
.st.first::before{top:26px}
.st.last::before{bottom:calc(100% - 26px)}
.dot{position:absolute;left:0;top:0;width:48px;height:56px;background:none;border:0;padding:0;display:grid;place-items:center;z-index:2}
.dot span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--acc);color:#fff;font-size:12px;font-weight:700;line-height:1}
.st.xfer .dot span{width:26px;height:26px;border-width:5px}
.st.done .dot span{background:var(--acc)}
.st.done .dot span::before{content:"✓"}
.card{grid-column:2;margin:4px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.st.next .card{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.st.done .card{opacity:1}
.st.done .line2,.st.done .tr{opacity:.6}
.head{width:100%;background:none;border:0;text-align:left;padding:10px 12px 10px;display:block}
.line1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-size:18px;font-weight:700;line-height:1.3}
.cd{font-size:11.5px;color:var(--sub);font-weight:400;margin-left:6px}
.at{font-size:20px;font-weight:700;white-space:nowrap}
.line2{display:flex;justify-content:space-between;gap:8px;color:var(--sub);font-size:13px;margin-top:2px}
.line2 span:last-child{white-space:nowrap}
.tr{margin-top:4px;font-size:12.5px;color:var(--sub)}
.tr b{font-weight:600;color:var(--ink)}
.act{margin-top:4px;font-size:13px;font-weight:600}
.act.ok{color:var(--ok)} .act.late{color:var(--late)}
.more{display:none;padding:2px 12px 12px;border-top:1px dashed var(--line)}
.st.open .more{display:block}
.rowc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.rowc>span{font-size:13px;color:var(--sub)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-weight:600}
.step output{min-width:64px;text-align:center;font-weight:700;font-size:16px}
.rowc input[type=time]{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px;font-size:16px}
.memo{width:100%;min-height:64px;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;resize:vertical;font-size:16px}
.split{width:100%;min-height:44px;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-weight:600}
.goal{margin-top:6px}
.arrive{display:block;width:calc(100% - 24px);margin:0 12px 12px;min-height:50px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
.gpsrow{display:none;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--tint);font-size:12.5px;color:var(--sub)}
.gpsrow.on{display:block}
.gpsrow b{color:var(--ink)}

.notes{margin:18px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--sub)}
.notes h2{font-size:14px;margin:0 0 6px;color:var(--ink)}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:3px 0}

.fab{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;min-height:52px;padding:0 18px;border-radius:26px;border:0;background:var(--acc);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.bar>span{transition:none}}
@media (min-width:600px){.fab{right:calc(50% - 280px)}}
/* 踏破 */
.cattab.donecat[aria-selected="true"]{background:var(--ok);color:#fff}
.tab.donetab{opacity:.8}
.tab .ck{color:var(--ok);font-weight:800}
.dsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.dsum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.dsum b{display:block;font-size:20px;line-height:1.2;color:var(--ok)}
.dsum span{font-size:11.5px;color:var(--sub)}
.dlist{list-style:none;margin:0 0 12px;padding:0}
.dlist li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:10px 12px;box-shadow:var(--shadow)}
.dlist li.go{cursor:pointer}
.dlist .sw{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.dlist .tx{flex:1;min-width:0}
.dlist .tx b{display:block;font-size:16px;line-height:1.3}
.dlist .tx small{color:var(--sub);font-size:12.5px}
.dlist .km{font-weight:700;white-space:nowrap}
.dhead{font-size:13px;color:var(--sub);margin:16px 0 6px;font-weight:700}
.badge{margin:4px 0 12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--ok);box-shadow:var(--shadow)}
.badge .bt{font-size:18px;font-weight:800;color:var(--ok)}
.badge .bs{font-size:13px;color:var(--sub);margin-top:2px}
.badge .br{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.badge input[type=date]{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px;font-size:16px}
.donebtn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--ok);color:#fff;font-weight:700}
.donebtn.sub{background:transparent;border:1.5px solid var(--line);color:var(--sub);font-weight:600}
.markrow{margin:0 0 12px}
.badge.ask{border-style:dashed}
.tm{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.at.dim{opacity:.4}
.real{font-size:20px;font-weight:700;line-height:1.3;white-space:nowrap;color:var(--ok)}
.real.late{color:var(--late)}
.real em{font-style:normal;font-size:12px;font-weight:700;margin-right:4px;opacity:.85}
.diff{font-size:12.5px;font-weight:700;color:var(--ok);white-space:nowrap}
.diff.late{color:var(--late)}
</style>
</head>
<body>
<div class="top">
  <div class="cattabs" id="cattabs" role="tablist"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="prog">
    <div class="prog-row"><span id="progL"></span><span id="progR"></span></div>
    <div class="goalrow" id="progG"></div>
    <div class="gpsrow" id="gpsRow"></div>
    <div class="bar"><span id="barFill"></span></div>
  </div>
</div>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" type="button">次の駅へ</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<section class="wrap"><details class="set" id="xfer"><summary>記録の引き継ぎ</summary><div class="setgrid">
<p class="setnote">別の画面（Claudeのアプリ版とGitHub版など）に記録を移すときに使います。移す元で「引き継ぎコードを作る」を押してコードをコピーし、移す先で下の欄に貼り付けて「読み込む」を押してください。移す先の記録は上書きされます。</p>
<button class="ghost" id="xOut" type="button">引き継ぎコードを作る</button>
<textarea class="memo" id="xBox" style="grid-column:1/-1" placeholder="ここに引き継ぎコードを貼り付け"></textarea>
<button class="ghost" id="xIn" type="button">貼り付けたコードを読み込む</button>
</div></details></section>

function defaults(l){
  return {
    start:l.start, speed:(l.speed||4), factor:(l.factor||1.2),
    brk:l.rows.map(r=>r.brk),
    nd:l.rows.map((r,i)=> i>0 && r.day!==l.rows[i-1].day),
    act:l.rows.map(()=>null),
    memo:l.rows.map(()=>""),
    fc:true,
    t:0
  };
}
function normalize(l,s){
  const wantRev = !!(s && typeof s==="object" && s.rev);
  if(!!l.rev!==wantRev) flipLine(l);
  const n=l.rows.length, d=defaults(l);
  d.rev = wantRev;
  if(s && typeof s==="object"){
    ["start","speed","factor","t","fc"].forEach(k=>{ if(s[k]!==undefined && s[k]!==null) d[k]=s[k]; });
    ["brk","nd","act","memo"].forEach(k=>{ if(Array.isArray(s[k]) && s[k].length===n) d[k]=s[k]; });
  }
  if(typeof d.start!=="string" || !/^\d\d:\d\d$/.test(d.start)) d.start=l.start;
  d.speed = (+d.speed>=1 && +d.speed<=8) ? +d.speed : (l.speed||4);
  d.factor = (+d.factor>=1 && +d.factor<=2) ? +d.factor : (l.factor||1.2);
  d.act = d.act.map(a=> (typeof a==="string" && /^\d\d:\d\d$/.test(a)) ? a : null);
  d.brk = d.brk.map((b,i)=> (isFinite(+b) && +b>=0) ? +b : l.rows[i].brk);
  d.memo = d.memo.map(m=> typeof m==="string" ? m : "");
  d.nd = d.nd.map(Boolean);
  d.t = +d.t || 0;
  d.fc = d.fc!==false;
  return d;
}
function flipLine(l){
  const r=l.rows, n=r.length, km=r.map(x=>x.km);
  const maxD=Math.max(...r.map(x=>x.day||1));
  l.rows = r.slice().reverse().map((x,j)=>Object.assign({},x,{km: j===0?0:km[n-j], day: maxD+1-(x.day||1)}));
  const m=(l.route||"").match(/^(.*?) → (.*?)(（.*）)?$/);
  if(m) l.route = m[2]+" → "+m[1]+(m[3]||"");
  l.rev=!l.rev;
}

async function pullLine(l){

async function initCloud(){

    }catch(e){}

    const curLine = LINES.find(x=>x.id===cur);
    if(curLine) await pullLine(curLine);
    syncOk=true;
    endBoot(); if(!booting) render();

    const rest = LINES.filter(x=>!curLine || x.id!==curLine.id);
    const outs = await Promise.all(rest.map(pullLine));

  }catch(e){

  }finally{

  }
}

function splitEven(l,s,D){
  const n=l.rows.length, nd=l.rows.map(()=>false);
  if(D<=1) return nd;
  const cum=[]; let t=0; l.rows.forEach(r=>{ t+=r.km; cum.push(t); });
  let last=0;
  for(let k=1;k<D;k++){
    const target=t*k/D; let best=-1, bd=Infinity;
    for(let i=last+1;i<=n-1-(D-k);i++){ const d=Math.abs(cum[i-1]-target); if(d<bd){bd=d;best=i;} }
    if(best<0) break; nd[best]=true; last=best;
  }
  return nd;
}
function compute(l,s){
  const out=[]; let cumKm=0, cumW=0, day=1, prevDep=0;
  const start=t2m(s.start);
  const n=l.rows.length;
  let dayW=0, nextTh=20;
  l.rows.forEach((r,i)=>{
    const wk = r.km*s.factor;
    const walk = Math.round(wk/s.speed*60);
    cumKm += r.km; cumW += wk;
    let arr;
    if(i===0){ arr=(s.act[0]? t2m(s.act[0]) : start); dayW=0; nextTh=20; }
    else if(s.nd[i]){ day++; arr=start+walk; dayW=wk; nextTh=20; }
    else { arr=prevDep+walk; dayW+=wk; }
    let autoBrk=0;
    if(i>0 && i<n-1){
      while(dayW>=nextTh){ autoBrk+=30; nextTh+=20; }
    }
    const manBrk = +s.brk[i]||0;
    const brk = manBrk + autoBrk;
    const dep = arr + brk;
    out.push({walk,arr,dep,day,wk,cumKm,cumW,brk,autoBrk,manBrk});
    prevDep = dep;
  });
  return out;
}

function forecast(l,s,c){
  const out=c.map(x=>({arr:x.arr,dep:x.dep,adj:false,plan:x.arr}));
  const info={on:false,ratio:1,ahead:0};
  if(!s.fc) return {out,info};
  const chk=[]; s.act.forEach((a,i)=>{ if(a) chk.push(i); });
  if(!chk.length) return {out,info};
  const A={}; let prev=-1;
  chk.forEach(i=>{ let m=t2m(s.act[i]); while(prev>=0 && m<prev-600) m+=1440; A[i]=m; prev=m; });
  const L=chk[chk.length-1];
  const sameDay=chk.filter(i=>c[i].day===c[L].day);
  const F0=sameDay[0];
  let ratio=1;
  if(sameDay.length>=2){
    const dp=c[L].arr-c[F0].arr, da=A[L]-A[F0];
    if(dp>=20) ratio=Math.min(2,Math.max(0.4,da/dp));
  }
  for(let i=L+1;i<c.length;i++){
    if(c[i].day!==c[L].day) continue;
    const arr=A[L]+ratio*(c[i].arr-c[L].arr);
    out[i]={arr:Math.round(arr),dep:Math.round(arr)+(+c[i].brk||0),adj:true,plan:c[i].arr};
  }
  info.on=true; info.ratio=ratio; info.ahead=c[L].arr-A[L]; info.L=L;
  return {out,info};
}

/* ---- GPS auto check (per device, foreground only) ---- */
const GPS={watch:null,line:null,pos:null,wake:null,err:"",pend:false};
function hasLL(l){ return l.rows.some(r=>r.ll); }
function gpsOn(l){ return lsGet("tw1:gps:"+l.id)==="1"; }
function hav(a,b,c,d){ const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)/2*p); return R*Math.sqrt(x*x+y*y); }
function gpsStop(){
  if(GPS.watch!=null){ try{ navigator.geolocation.clearWatch(GPS.watch); }catch(e){} GPS.watch=null; }
  if(GPS.wake){ try{ GPS.wake.release(); }catch(e){} GPS.wake=null; }
  GPS.line=null; GPS.pos=null;
}
function gpsSync(){
  const l=LINES.find(x=>x.id===cur);
  const want = l && hasLL(l) && gpsOn(l) && ("geolocation" in navigator);
  if(!want){ if(GPS.watch!=null) gpsStop(); return; }
  if(GPS.watch!=null && GPS.line===l.id) return;
  gpsStop(); GPS.line=l.id; GPS.err="";
  try{
    GPS.watch = navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  }catch(e){ GPS.err="この画面ではGPSを使えないようです"; GPS.watch=null; }
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(w=>{ GPS.wake=w; }).catch(()=>{}); }catch(e){}
}
function onPosErr(err){
  if(err && err.code===1){ GPS.err="位置情報が許可されていません（この画面では使えない場合もあります）"; const l=LINES.find(x=>x.id===cur); if(l) lsSet("tw1:gps:"+l.id,"0"); gpsStop(); render(); toast("位置情報が許可されなかったので、GPS自動チェックをオフにしました。"); }
  else { GPS.err="GPSの電波を探しています…"; gpsPaint(); }
}
function nextUnchecked(l,s){ return s.act.findIndex(a=>!a); }
function onPos(p){
  const l=LINES.find(x=>x.id===cur); if(!l || l.id!==GPS.line) return;
  const s=getState(l);
  GPS.err=""; GPS.pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
  const i0=nextUnchecked(l,s);
  if(i0>=0 && GPS.pos.acc<=120){
    let ip=-1; for(let k=i0-1;k>=0;k--){ if(s.act[k]){ ip=k; break; } }
    const lim = gpsReach(l,s,ip);
    let hit=-1;
    for(let i=i0;i<l.rows.length;i++){
      if(i>=i0+3 && (ip<0 || i>lim)) break;
      const r=l.rows[i]; if(!r.ll) continue;
      if(hav(GPS.pos.lat,GPS.pos.lon,r.ll[0],r.ll[1])<=150){ hit=i; break; }
    }
    if(hit>=0){ gpsMark(l,s,i0,hit); return; }
    if(ip>=0 && gpsCatch(l,s,i0,ip,lim)) return;
  }
  gpsPaint();
}
/* 前回の記録からの経過時間で、ここまでなら歩けたはずという駅の番号 */
function gpsReach(l,s,ip){
  if(ip<0) return -1;
  const el=((t2m(stamp())-t2m(s.act[ip]))%1440+1440)%1440;
  if(el>16*60) return -1;
  const maxKm=(el/60)*s.speed*1.5/(s.factor||1)+1;
  let t=0, k=ip;
  for(let i=ip+1;i<l.rows.length;i++){ t+=l.rows[i].km; if(t>maxKm) break; k=i; }
  return Math.min(l.rows.length-1,k+1);
}
/* 駅と駅の間にいるとき：通り過ぎた駅をまとめてチェック（時刻は距離で割り振った推定） */
function gpsCatch(l,s,i0,ip,lim){
  if(lim<=i0) return false;
  const P=GPS.pos, cosL=Math.cos(P.lat*Math.PI/180);
  const xy=ll=>[(ll[1]-P.lon)*111320*cosL,(ll[0]-P.lat)*110540];
  let best=null;
  for(let k=Math.max(i0,1);k<=lim;k++){
    const a=l.rows[k-1].ll, b=l.rows[k].ll; if(!a||!b) continue;
    const A=xy(a), B=xy(b), dx=B[0]-A[0], dy=B[1]-A[1], L2=dx*dx+dy*dy;
    let t = L2>0 ? -(A[0]*dx+A[1]*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(A[0]+t*dx, A[1]+t*dy);
    if(!best || d<best.d) best={k,t,d};
  }
  if(!best || best.d>1500) return false;
  const last=best.k-1;           // ここまでは通過済み
  if(last<i0) return false;
  const cum=[]; let c=0; l.rows.forEach(r=>{ c+=r.km; cum.push(c); });
  const cNow=cum[last]+best.t*l.rows[best.k].km;
  const tp=t2m(s.act[ip]), el=((t2m(stamp())-tp)%1440+1440)%1440;
  if(cNow<=cum[ip]) return false;
  for(let k=i0;k<=last;k++){
    const m=Math.round(tp+el*(cum[k]-cum[ip])/(cNow-cum[ip]));
    s.act[k]=pad(Math.floor(((m%1440)+1440)%1440/60))+":"+pad(((m%60)+60)%60);
  }
  try{ save(l); }catch(e){}
  const act=document.activeElement;
  if(!(act && (act.tagName==="TEXTAREA"||act.tagName==="INPUT"))) render();
  toast((last>i0? l.rows[i0].name+"〜":"")+l.rows[last].name+" を通過済みにしました（時刻は推定）。"+lastGoalText);
  return true;
}
function gpsMark(l,s,i0,hit){
  const now=stamp();
  let ip=-1; for(let k=i0-1;k>=0;k--){ if(s.act[k]){ ip=k; break; } }
  const cum=[]; let t=0; l.rows.forEach(r=>{ t+=r.km; cum.push(t); });
  for(let k=i0;k<hit;k++){
    if(ip>=0 && cum[hit]>cum[ip]){
      const tp=t2m(s.act[ip]), tn=t2m(now);
      const m=Math.round(tp+(tn-tp)*(cum[k]-cum[ip])/(cum[hit]-cum[ip]));
      s.act[k]=pad(Math.floor(((m%1440)+1440)%1440/60))+":"+pad(((m%60)+60)%60);
    } else s.act[k]=now;
  }
  s.act[hit]=now;
  try{ save(l); }catch(e){}
  const act=document.activeElement;
  if(act && (act.tagName==="TEXTAREA"||act.tagName==="INPUT") && !GPS.pend){ GPS.pend=true; setTimeout(()=>{ GPS.pend=false; render(); },6000); }
  else if(!(act && (act.tagName==="TEXTAREA"||act.tagName==="INPUT"))) render();
  toast(l.rows[hit].name+" "+now+" に着きました（GPS）。"+lastGoalText);
}
function gpsPaint(){
  const e=document.getElementById("gpsRow"); if(!e) return;
  const l=LINES.find(x=>x.id===cur);
  if(!l || !hasLL(l) || !gpsOn(l)){ e.className="gpsrow"; e.textContent=""; return; }
  const s=getState(l); const i0=nextUnchecked(l,s);
  let txt="";
  if(GPS.err) txt=GPS.err;
  else if(i0<0) txt="すべての駅に着きました。";
  else if(!GPS.pos) txt="GPSの電波を探しています…";
  else {
    const r=l.rows[i0]; let d=null;
    if(r.ll) d=hav(GPS.pos.lat,GPS.pos.lon,r.ll[0],r.ll[1]);
    const acc=Math.round(GPS.pos.acc);
    txt="GPS自動チェック中　次の駅 <b>"+r.name+"</b>"+(d==null?"":" まであと約"+(d>=1000?(d/1000).toFixed(1)+"km":Math.round(d/10)*10+"m"))+"　（誤差約"+acc+"m"+(acc>120?"・精度が低いため判定しません":"")+"）";
  }
  e.className="gpsrow on"; e.innerHTML=txt;
}


function xferOut(){
  const o={v:1,cur:cur,lines:{},gps:{},done:DONE};
  LINES.forEach(l=>{
    let st=states[l.id];
    if(!st){ try{ st=JSON.parse(lsGet("tw1:"+l.id)); }catch(e){ st=null; } }
    if(st && st.t) o.lines[l.id]=st;
    if(lsGet("tw1:gps:"+l.id)==="1") o.gps[l.id]=1;
  });
  const code="TW1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const box=document.getElementById("xBox"); box.value=code; box.focus(); box.select();
  let ok=false;
  try{ if(navigator.clipboard){ navigator.clipboard.writeText(code).then(()=>toast("引き継ぎコードをコピーしました（"+Object.keys(o.lines).length+"路線分）")).catch(()=>toast("欄のコードを長押しして全部コピーしてください")); ok=true; } }catch(e){}
  if(!ok) toast("欄のコードを長押しして全部コピーしてください");
}
function xferIn(){
  const raw=(document.getElementById("xBox").value||"").trim();
  let o=null;
  try{ if(!raw.startsWith("TW1:")) throw 0; o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4))))); }catch(e){ toast("コードを読み取れませんでした。全部コピーできているか確認してください"); return; }
  let n=0;
  LINES.forEach(l=>{
    const st=o.lines&&o.lines[l.id];
    if(st){ states[l.id]=normalize(l,st); save(l); n++; }
    if(o.gps){ if(o.gps[l.id]) lsSet("tw1:gps:"+l.id,"1"); }
  });
  if(o.done && o.done.map){ DONE={map:Object.assign({},DONE_SEED,o.done.map),t:0}; saveDone(); }
  if(o.cur && (o.cur===DONE_LIST_ID || VISIBLE.some(x=>x.id===o.cur))){ cur=o.cur; saveCur(); }
  document.getElementById("xBox").value="";
  render(); toast(n+"路線分の記録を読み込みました");
}
document.getElementById("xOut").addEventListener("click",xferOut);
document.getElementById("xIn").addEventListener("click",xferIn);

render();
initCloud();
</script>
